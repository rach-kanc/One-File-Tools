<!--
URL Encoder / Decoder
Single-file offline tool for encoding and decoding URL strings.
Built for One File Tools.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Encoder / Decoder - One File Tools</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Feather Icons (No CDN) -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
      :root {
        --bg: #030712;
        --grid-line: #111827;
        --bg-panel: rgba(17, 24, 39, 0.7);
        --panel-border: #1f2937;
        --accent: #f59e0b;
        --accent-glow: rgba(245, 158, 11, 0.15);
        --accent-hover: #d97706;
        --error: #ef4444;
        --error-bg: rgba(239, 68, 68, 0.1);
        --text: #f9fafb;
        --text-muted: #9ca3af;
        --text-dim: #4b5563;
        --input-bg: rgba(3, 7, 18, 0.6);
        
        --font-sans: "Inter", system-ui, sans-serif;
        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg);
        background-image: radial-gradient(circle at 15% 50%, rgba(245, 158, 11, 0.05), transparent 25%), radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.05), transparent 25%), linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size:
          100% 100%,
          100% 100%,
          32px 32px,
          32px 32px;
        color: var(--text);
        padding: 48px 20px 80px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 1rem;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 40px rgba(255,255,255,0.1);
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 1.5rem;
        flex: 1;
        align-items: stretch;
      }

      @media (max-width: 900px) {
        .panels {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto auto;
        }
      }

      .panel {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        min-height: 450px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .panel-title {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .panel-actions {
        display: flex;
        gap: 0.5rem;
      }

      .btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--panel-border);
        color: var(--text);
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
      
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      
      .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      
      .textarea-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      
      textarea {
        flex: 1;
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 1rem;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.95rem;
        line-height: 1.5;
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }

      textarea:focus {
        border-color: var(--accent);
      }
      
      textarea::placeholder {
        color: var(--text-dim);
      }

      .controls {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
      }
      
      @media (max-width: 900px) {
        .controls {
          flex-direction: row;
        }
      }

      .error-msg {
        color: var(--error);
        font-size: 0.85rem;
        margin-top: 0.5rem;
        display: none;
      }
      
      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--accent);
        color: #000;
        padding: 0.75rem 1.5rem;
        border-radius: 99px;
        font-weight: 600;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px var(--accent-glow);
        z-index: 1000;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      .options-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
        gap: 1.5rem;
        background: var(--bg-panel);
        padding: 1rem 2rem;
        border-radius: 99px;
        border: 1px solid var(--panel-border);
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
      }

      .radio-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
      }
      
      .radio-group input[type="radio"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .radio-label {
        font-size: 0.9rem;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      
      .tooltip {
        position: relative;
        cursor: help;
        color: var(--text-muted);
      }
      
      .tooltip:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        background: #1f2937;
        color: #f9fafb;
        padding: 0.5rem;
        border-radius: 6px;
        font-size: 0.75rem;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }
      
      .tooltip:hover::before {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border-width: 4px;
        border-style: solid;
        border-color: #1f2937 transparent transparent transparent;
        z-index: 10;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>URL Encoder / Decoder</h1>
        <p class="subtitle">Safely encode and decode URL parameters or entire URIs.</p>
      </header>

      <div class="options-bar">
        <label class="radio-group">
          <input type="radio" name="mode" value="component" checked>
          <span class="radio-label">
            Component (Strict)
            <i data-feather="help-circle" class="tooltip" width="14" height="14" data-tooltip="Encodes ? & = / etc. (Best for query params)"></i>
          </span>
        </label>
        <label class="radio-group">
          <input type="radio" name="mode" value="uri">
          <span class="radio-label">
            Full URI (Loose)
            <i data-feather="help-circle" class="tooltip" width="14" height="14" data-tooltip="Ignores ? & = / etc. (Best for full URLs)"></i>
          </span>
        </label>
      </div>

      <div class="panels">
        
        <!-- Input Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <i data-feather="align-left"></i>
              Raw Text
            </h2>
            <div class="panel-actions">
              <button class="btn" id="btnCopyText" title="Copy">
                <i data-feather="copy" width="14" height="14"></i>
              </button>
              <button class="btn" id="btnClearText" title="Clear">
                <i data-feather="trash-2" width="14" height="14"></i>
              </button>
            </div>
          </div>
          
          <div class="textarea-wrapper">
            <textarea id="inputText" placeholder="Paste your raw text or URL here..."></textarea>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="btn btn-primary" id="btnEncode" title="Encode text">
            Encode
            <i data-feather="arrow-right"></i>
          </button>
          
          <button class="btn" id="btnDecode" title="Decode text">
            <i data-feather="arrow-left"></i>
            Decode
          </button>
        </div>

        <!-- Output Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">
              <i data-feather="link"></i>
              URL Encoded
            </h2>
            <div class="panel-actions">
              <button class="btn" id="btnCopyUrl" title="Copy">
                <i data-feather="copy" width="14" height="14"></i>
              </button>
              <button class="btn" id="btnClearUrl" title="Clear">
                <i data-feather="trash-2" width="14" height="14"></i>
              </button>
            </div>
          </div>
          
          <div class="textarea-wrapper">
            <textarea id="urlText" placeholder="Paste your percent-encoded URL here..."></textarea>
            <div class="error-msg" id="errorMsg">Malformed URI Sequence</div>
          </div>
        </div>

      </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
      // Initialize Icons safely
      if (typeof feather !== 'undefined') {
        feather.replace();
      }

      // DOM Elements
      const inputText = document.getElementById('inputText');
      const urlText = document.getElementById('urlText');
      const btnEncode = document.getElementById('btnEncode');
      const btnDecode = document.getElementById('btnDecode');
      
      const btnCopyText = document.getElementById('btnCopyText');
      const btnClearText = document.getElementById('btnClearText');
      const btnCopyUrl = document.getElementById('btnCopyUrl');
      const btnClearUrl = document.getElementById('btnClearUrl');
      
      const errorMsg = document.getElementById('errorMsg');
      const toast = document.getElementById('toast');
      const radioModes = document.getElementsByName('mode');
      
      function getMode() {
        for (let radio of radioModes) {
          if (radio.checked) return radio.value;
        }
        return 'component';
      }

      function encodeStr() {
        errorMsg.style.display = 'none';
        const raw = inputText.value;
        if (!raw) {
          urlText.value = '';
          return;
        }
        
        try {
          if (getMode() === 'component') {
            urlText.value = encodeURIComponent(raw);
          } else {
            urlText.value = encodeURI(raw);
          }
        } catch (e) {
          urlText.value = '';
          errorMsg.textContent = "Encoding Error: " + e.message;
          errorMsg.style.display = 'block';
        }
      }

      function decodeStr() {
        errorMsg.style.display = 'none';
        const encoded = urlText.value;
        if (!encoded) {
          inputText.value = '';
          return;
        }
        
        try {
          if (getMode() === 'component') {
            inputText.value = decodeURIComponent(encoded);
          } else {
            inputText.value = decodeURI(encoded);
          }
        } catch (e) {
          inputText.value = '';
          errorMsg.textContent = "Malformed URI sequence";
          errorMsg.style.display = 'block';
        }
      }

      // Action Listeners
      btnEncode.addEventListener('click', encodeStr);
      btnDecode.addEventListener('click', decodeStr);
      

      // Auto update if mode is changed (if either side has data, prioritize the left side (encode), else decode)
      Array.from(radioModes).forEach(radio => {
        radio.addEventListener('change', () => {
          if (inputText.value) {
            encodeStr();
          } else if (urlText.value) {
            decodeStr();
          }
        });
      });

      // Utility Listeners
      btnClearText.addEventListener('click', () => {
        inputText.value = '';
        inputText.focus();
      });
      
      btnClearUrl.addEventListener('click', () => {
        urlText.value = '';
        urlText.focus();
        errorMsg.style.display = 'none';
      });

      btnCopyText.addEventListener('click', () => {
        if (!inputText.value) return;
        navigator.clipboard.writeText(inputText.value).then(() => {
          showToast('Raw text copied!');
        });
      });

      btnCopyUrl.addEventListener('click', () => {
        if (!urlText.value) return;
        navigator.clipboard.writeText(urlText.value).then(() => {
          showToast('Encoded URL copied!');
        });
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
      
      // Ctrl+Enter support
      inputText.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') encodeStr();
      });
      urlText.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') decodeStr();
      });
    </script>
  </body>
</html>
